[package]
name = "pglited"
version = "0.1.0"
edition = "2021"
description = "A Wasmtime-based PostgreSQL runtime that runs PostgreSQL via WebAssembly"
repository = "https://github.com/filipecabaco/pglited"
license = "MIT"

[lib]
name = "pglited"
path = "src/lib.rs"

[[bin]]
name = "pglited"
path = "src/main.rs"

[[bin]]
name = "build_artifacts"
path = "src/bin/build_artifacts.rs"

[dependencies]
wasmtime = "40"
wasmtime-wasi = "40"
serde_json = "1.0"
anyhow = "1.0"
zstd = "0.13"
tar = "0.4"
once_cell = "1.19"
tokio = { version = "1.40", features = ["full", "rt-multi-thread", "macros"] }

[dev-dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
