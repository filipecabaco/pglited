[package]
name = "pglited"
version = "0.1.0"
edition = "2021"
description = "A self-contained PostgreSQL runtime using V8 and PGlite WebAssembly"
repository = "https://github.com/filipecabaco/pglited"
license = "MIT"

[lib]
name = "pglited"
path = "src/lib.rs"

[[bin]]
name = "pglited"
path = "src/main.rs"


[dependencies]
anyhow = "1.0"
flate2 = "1.0"
once_cell = "1.19"
regex = "1"
deno_core = "0.382"
deno_error = "0.7.3"
rust-embed = { version = "8", features = ["include-exclude"] }
serde = "1.0"
serde_json = "1.0"
tokio = { version = "1.40", features = ["full", "rt-multi-thread", "macros"] }

[dev-dependencies]
tokio-postgres = "0.7"

[build-dependencies]
ureq = "2.9"
tar = "0.4"
flate2 = "1.0"


[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
