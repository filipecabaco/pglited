name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-ubuntu:
    name: Build (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-stable-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-stable-
            ${{ runner.os }}-cargo-registry-
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-stable-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-index-stable-
            ${{ runner.os }}-cargo-index-
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-release-

      - name: Cache downloaded assets
        uses: actions/cache@v4
        with:
          path: assets/pglite_npm
          key: pglite-npm-assets-${{ runner.os }}-v1
          restore-keys: |
            pglite-npm-assets-${{ runner.os }}-

      - name: Build release binary
        run: cargo build --release
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: true

      - name: Verify release binary
        run: |
          if [ ! -f target/release/pglited ]; then
            echo "ERROR: Release binary not found"
            exit 1
          fi
          echo "✓ Release binary built successfully"
          ls -lh target/release/pglited
          echo "✓ All assets auto-generated during build:"
          ls -lh assets/

      - name: Upload release binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: pglited-ubuntu
          path: target/release/pglited
          retention-days: 1

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-stable-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-stable-
            ${{ runner.os }}-cargo-registry-
      
      - name: Cache cargo index
